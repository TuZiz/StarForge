name: StarForge
version: '1.0.0'
main: ym.starforge.StarForge
api-version: '26.2'
folia-supported: true
authors:
  - 'ym'
softdepend:
  - 'Vault'
  - 'PlaceholderAPI'
  - 'CraftEngine'
  - 'ItemHub'
  - 'AsterStats'
  - 'NextDoorFarm'
commands:
  starforge:
    description: '物品制作、兑换、耗时锻造与武器强化管理'
    aliases:
      - 'sf'
permissions:
  starforge.use:
    description: '使用强化、耗时锻造、幸运符与保护符'
    default: true
  starforge.admin:
    description: '管理配方解锁、菜单、材料、标记、等级和重载'
    default: op
