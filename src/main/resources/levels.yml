schema-version: 1
# 等级键为本次目标等级；成长逐级累加，percent 使用小数，如 0.05=5%。
# attack-* 只用于武器；defense-* 只用于防具。旧文件缺防御字段时内存默认每级 +0.20 与基础防御的 5%。
# stone-chances 为单颗成功率贡献，按目标等级覆盖材料默认值。
# required-stone 至少实扣一颗，计入最低颗数。空字符串表示无指定材料。
# downgrade-chance 和 crack-chance 只在失败时判定，两种结果互斥。
