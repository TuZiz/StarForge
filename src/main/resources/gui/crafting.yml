schema-version: 1
background-image: 'starforge:craft_gallery_six'
title: '<font:starforge:ui><#EAD6AF>    装备配方</font>'
# 可为任意品类设置配方页标题。未配置时显示上方的 title。
category-titles:
  machines: '<font:starforge:ui><#EAD6AF>    机器配方</font>' # 机器

# 每页六张配方卡。收获解锁的配方可提前查看。
shape:
  - 'FRFFRFFRF'
  - 'FSFFSFFSF'
  - 'FRFFRFFRF'
  - 'FSFFSFFSF'
  - 'PNFBBBTTT'

elements:
  F:
    action: 'none'
    material: 'BLACK_STAINED_GLASS_PANE'
    name: ''

  R:
    action: 'recipe'
    # 可用客户端 ItemModel 为指定配方覆盖未解锁卡片。省略时使用共用卡片。
    locked-models:
      fuel_press: 'starforge:crafting/unlock/recipe_fuel_press' # 燃料压制机
    # 材料名称来自真实 CE / ItemHub 物品；数量每秒随背包更新。
    material-enough: '<#4ADE80>  ✔ <#CBD5E1>{material} <#86EFAC>×{required} <#64748B>(拥有 {owned} · 充足)'
    material-missing: '<#F87171>  ✕ <#CBD5E1>{material} <#F87171>×{required} <#64748B>(拥有 {owned} · <#FCA5A5>缺 {missing}<#64748B>)'
    lore:
      - ''
      - '<#C084FC>❖ 材料需求:'
      - '{materials}'
      - ''
      - '<#94A3B8>▸ 预计产出: <#E2E8F0>{amount} 件'
      - '<#94A3B8>▸ 锻造费用: <#FBBF24>{money} 金币'
      - '<#94A3B8>▸ 预计耗时: <#67E8F9>{duration} 秒'
      - ''
      - '<#86EFAC>► 点击进入锻造台查看详情'

  P:
    action: 'previous'
    craft-engine: 'starforge:craft_nav_previous'
    name: '<#FBBF24>« 上一页'
    lore:
      - '<#94A3B8>点击切换至上一页配方'

  T:
    action: 'orders'
    craft-engine: 'starforge:gui_blank'
    name: '<#67E8F9>⏳ 我的锻造队列'
    lore:
      - ''
      - '<#94A3B8>▸ 查看正在进行的锻造进度与剩余时间'
      - '<#94A3B8>▸ 离线期间锻造计时将正常进行'
      - ''
      - '<#86EFAC>► 点击查看队列 / 领取成品'

  N:
    action: 'next'
    craft-engine: 'starforge:craft_nav_next'
    name: '<#FBBF24>下一页 »'
    lore:
      - '<#94A3B8>点击切换至下一页配方'


  B:
    action: 'back'
    craft-engine: 'starforge:gui_blank'
    name: '<#EAD6AF>返回类型'
  S:
    action: 'recipe-caption'
    craft-engine: 'starforge:gui_blank'
    # 卡片文字由独立CE物品显示；新增配方可在此指定对应名称贴图。
    captions:
      iron_sword: 'starforge:craft_name_iron_sword'
      star_sword: 'starforge:craft_name_star_sword'
      aster_head: 'starforge:craft_name_aster_head'
      aster_chest: 'starforge:craft_name_aster_chest'
      aster_legs: 'starforge:craft_name_aster_legs'
      aster_feet: 'starforge:craft_name_aster_feet'
      fuel_press: 'starforge:craft_name_fuel_press' # 燃料压制机
